<form (ngSubmit)="onSubmit()">
  <label for="code">Code:</label>
  <input id="code" [(ngModel)]="newStudent.code" name="code" required />
  <label for="lastName">Nom:</label>
  <input
    id="lastName"
    [(ngModel)]="newStudent.lastName"
    name="lastName"
    required
  />

  <label for="firstName">Prénom:</label>
  <input
    id="firstName"
    [(ngModel)]="newStudent.firstName"
    name="firstName"
    required
  />

  <label for="email">Email:</label>
  <input
    id="email"
    [(ngModel)]="newStudent.email"
    name="email"
    type="email"
    required
  />

  <label for="phone">Téléphone:</label>
  <input id="phone" [(ngModel)]="newStudent.phone" name="phone" required />

  <label for="speciality">Spécialité:</label>
  <input
    id="speciality"
    [(ngModel)]="newStudent.speciality"
    name="speciality"
    required
  />

  <label for="entryAt">Date d'entrée:</label>
  <input
    id="entryAt"
    [(ngModel)]="newStudent.entryAt"
    name="entryAt"
    type="date"
    required
  />

  <label for="firstDepartureMissionAt">Date départ en mission:</label>
  <input
    id="firstDepartureMissionAt"
    [(ngModel)]="newStudent.firstDepartureMissionAt"
    name="firstDepartureMissionAt"
    type="date"
    required
  />

  <button type="submit">Ajouter</button>
</form>
